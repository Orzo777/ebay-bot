name: tests

# Юніт-тести без мережі на кожен push/PR: ідентифікація товару, шар рішення, конвеєр.
on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: for t in tools/test_*.js; do node "$t" || exit 1; done   # Apps Script: облік, фільтр, боти, сторож, версії
      - run: python -m unittest discover -p "test_*.py"   # усі test_*.py — новий тест не забудеться
