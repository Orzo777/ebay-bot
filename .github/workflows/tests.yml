name: tests

# Юніт-тести без мережі на кожен push/PR: ідентифікація товару, шар рішення, конвеєр.
on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: node tools/test_ledger.js && node tools/test_kafilter.js && node tools/test_webhook.js && node tools/test_watchdog.js && node tools/test_sell.js && node tools/test_weekly.js   # Apps Script: облік, фільтр скаму, два боти, сторож
      - run: python -m unittest test_identity test_pipeline test_econ test_check test_apiusage test_feed test_ram test_ram_parse test_ram_alert test_console_alert test_ram_mail_hint test_ka_listing_check test_ka_share test_price_refresh test_pc_alert test_ebay_watch test_photo_check test_audit_cases test_health test_sell test_ram_mail_imap test_weekly_report -v
