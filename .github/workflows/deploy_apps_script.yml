name: deploy_apps_script

# Автооновлення Apps Script (04.10): зміна tools/*.gs у main → тести Apps Script → tools/deploy_apps_script.py заливає
# код у проєкт, створює версію і переводить на неї вебзастосунок (адреса вебхука та сама). Результат — у бот «Облік і
# продаж». Секрети: CLASPRC_JSON (вміст ~/.clasprc.json після clasp login з вузькими правами), APPS_SCRIPT_ID.
# Репозиторій публічний — у лог лише назви файлів і номер версії.

on:
  push:
    branches: [main]
    paths: ["tools/*.gs"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Лише показати, що змінилось би"
        type: boolean
        default: false

concurrency:
  group: deploy_apps_script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Self-check (Apps Script tests)
        run: |
          for t in tools/test_*.js; do node "$t" || exit 1; done
          python -m unittest test_deploy_apps_script

      - name: Deploy
        env:
          # 18.10: перехід на окрему пошту — новий проєкт у новому акаунті (вхід clasp «new»)
          CLASPRC_JSON: ${{ secrets.NEW_CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.NEW_APPS_SCRIPT_ID }}
          CLASP_USER: new
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python tools/deploy_apps_script.py ${{ inputs.dry_run && '--dry-run' || '' }}
