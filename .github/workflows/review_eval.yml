name: review-eval

# 19.10: перевірка ШІ-читання оголошень (опис + фото, research/photo_check.py) на відомих поганих і нормальних
# оголошеннях. Лише вручну (gh workflow run review_eval.yml); у лог — висновки щодо публічних оголошень.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python research/review_eval.py
