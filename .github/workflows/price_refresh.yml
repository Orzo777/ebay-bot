name: price-refresh

# Сторож ринкових цін (з 01.10 — щодня, RAM і консолі): ціни продажу, від яких рахуються стелі купівлі.
# Запускає eBay-сторож раз на добу після 05:00 UTC (research/ebay_watch.py); cron нижче — запасний.
# ~35 викликів Browse API (+~20 раз на місяць — замір нових категорій); коміт research/ram_prices.json;
# у бот «Облік і продаж» — лише коли тип подешевшав на ≥5% / подорожчав на ≥10% за тиждень або знайшлась нова категорія.

on:
  schedule:
    - cron: "30 6 * * *"   # щодня 06:30 UTC (запасний — основний запуск від eBay-сторожа)
  workflow_dispatch: {}

concurrency:
  group: price-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Self-check (unit tests)
        run: python -m unittest test_ram_parse test_ram_alert test_console_alert test_price_refresh

      - name: Refresh prices
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python research/price_refresh.py

      - name: Commit if changed
        run: |
          git config user.name "ebay-bot"
          git config user.email "bot@local"
          git add research/ram_prices.json
          if git diff --cached --quiet; then
            echo "без змін"
          else
            git commit -m "price-refresh: RAM & console sale prices $(date -u +%F)"
            git pull --rebase -q origin main && git push
          fi
