name: ka-share

# «Поділитися → бот»: користувач ділиться оголошенням Kleinanzeigen у Telegram-бот; вебхук Google Apps Script
# (tools/gmail_trigger.gs, doPost) запускає цей workflow з текстом повідомлення. Скрипт відкриває одну сторінку
# оголошення і відповідає карткою в той самий чат. Чужі чати ігноруються (порівняння з TELEGRAM_CHAT_ID).

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Текст повідомлення з Telegram (посилання на оголошення)"
        # не required: фото без підпису чи пересланий пост дають порожній текст, а GitHub тоді мовчки відхиляє
        # запуск (422) — і бот нічого не відповідає. Порожній текст → відповідь «не бачу посилання».
        required: false
        default: ""
      chat_id:
        description: "chat.id відправника (перевіряється проти секрету)"
        required: true

# Повтори Telegram (Apps Script відповідає 302 → Telegram шле те саме ще раз) відсіює сам Apps Script за update_id
# (TG_SEEN у gmail_trigger.gs). 08.10: тут була черга concurrency з ПОВНИМ текстом у назві — довге посилання з додатка
# eBay (сотні символів параметрів) перевищило ліміт назви, і GitHub валив запуск ще до старту («workflow file issue»).

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore card map
        uses: actions/cache/restore@v4
        with:
          path: ka_share_state.json
          key: kashare-${{ github.run_id }}
          restore-keys: kashare-

      - name: Evaluate shared listing
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHARE_TEXT: ${{ inputs.text }}
          SHARE_CHAT: ${{ inputs.chat_id }}
          KA_SHARE_STATE: ka_share_state.json
          PYTHONIOENCODING: utf-8
        # вхідні дані — лише через змінні оточення (не підставляються в команду)
        run: |
          # "owner" — ручний запуск власником репозиторію (gh workflow run); з вебхука приходить лише числовий chat.id
          if [ "$SHARE_CHAT" != "$TELEGRAM_CHAT_ID" ] && [ "$SHARE_CHAT" != "owner" ]; then echo "чужий чат — ігнорую"; exit 0; fi
          python research/ka_share.py "$SHARE_TEXT"

      - name: Save card map
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ka_share_state.json
          key: kashare-${{ github.run_id }}
