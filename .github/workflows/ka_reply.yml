name: ka-reply

# Відповідь продавця Kleinanzeigen → реплаєм на картку, з якої писав користувач (02.10). Запускає Apps Script
# (tools/kafilter.gs) з уже готовим зашифрованим текстом; тут лише пошук картки в карті карток і надсилання.
# 06.10: прибирання переписки — mode=close (облік записав покупку з KA, номер оголошення зашифрований) і щогодинна
# перевірка (schedule): оголошення зняте → відповіді видаляються з чату (старші 48 год — згортаються в один рядок).
# Стан (номер оголошення → id відповідей) — у кеші ka_replies_state.json; запуски по черзі (concurrency).

on:
  workflow_dispatch:
    inputs:
      blob:
        description: "Зашифрований текст (з Apps Script)"
        required: false
        default: ""
      mac:
        description: "Підпис"
        required: false
        default: ""
      nonce:
        description: "Nonce"
        required: false
        default: ""
      mode:
        description: "reply | close | sweep"
        required: false
        default: "reply"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: ka-reply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore KA card map (read-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reply' }}
        uses: actions/cache/restore@v4
        with:
          path: ram_mail_state.json
          key: rammailstate-reply-${{ github.run_id }}
          restore-keys: rammailstate-

      - name: Restore share card map (read-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reply' }}
        uses: actions/cache/restore@v4
        with:
          path: ka_share_state.json
          key: kashare-reply-${{ github.run_id }}
          restore-keys: kashare-

      - name: Restore sent replies
        uses: actions/cache/restore@v4
        with:
          path: ka_replies_state.json
          key: kareplies-${{ github.run_id }}
          restore-keys: kareplies-

      - name: Run
        env:
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB: ${{ inputs.blob }}
          MAC: ${{ inputs.mac }}
          NONCE: ${{ inputs.nonce }}
          MODE: ${{ github.event_name == 'schedule' && 'sweep' || inputs.mode }}
          PYTHONIOENCODING: utf-8
        run: |
          case "$MODE" in
            sweep) python research/ka_reply.py --sweep --replies ka_replies_state.json ;;
            close) python research/ka_reply.py --close-blob "$BLOB" --mac "$MAC" --nonce "$NONCE" --replies ka_replies_state.json ;;
            *)     python research/ka_reply.py --blob "$BLOB" --mac "$MAC" --nonce "$NONCE" \
                     --ka ram_mail_state.json --share ka_share_state.json --replies ka_replies_state.json ;;
          esac

      - name: Save sent replies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ka_replies_state.json
          key: kareplies-${{ github.run_id }}
