name: ram-mail-alert

# Читає нові листи Kleinanzeigen (Suchauftrag) кожні ~15 хв, оцінює через
# research/ram_alert.py і шле в Telegram (той самий бот, що й основний бот)
# картку з вердиктом + кнопкою-посиланням на оголошення. Повідомлення
# продавцю НЕ надсилається автоматично — лише сам користувач з телефону.
#
# Основний запуск — з Google Apps Script (tools/gmail_trigger.gs): щохвилини бачить
# новий лист у Gmail і викликає workflow_dispatch, ~1,5–2 хв від листа до картки.
# cron нижче — лише запасний: GitHub фактично запускав його раз на 2,5–5 год (22–23.09).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Діагностика: показати вердикти всіх листів за 2 дні, нічого не надсилати"
        type: boolean
        default: false

concurrency:
  group: ram-mail-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Запобіжник: зламаний фільтр не має слати сповіщення про гроші. Без мережі, ~1 с.
      - name: Self-check (unit tests)
        run: python -m unittest test_ram_parse test_ram_alert test_console_alert test_ram_mail_hint test_ka_listing_check

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ram_mail_state.json
          key: rammailstate-${{ github.run_id }}
          restore-keys: rammailstate-

      - name: Ensure state file exists
        run: |
          test -f ram_mail_state.json || printf '{"seen_ids": []}' > ram_mail_state.json

      - name: Check mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PC_BOT_TOKEN: ${{ secrets.PC_BOT_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python research/ram_mail_check.py --state ram_mail_state.json --dry-run
          else
            python research/ram_mail_check.py --state ram_mail_state.json
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ram_mail_state.json
          key: rammailstate-${{ github.run_id }}
