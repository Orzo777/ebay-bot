name: sell

# «продати N» у боті «Облік і продаж» (01.10): Apps Script (tools/ledger.gs) бере рядок з обліку, шифрує назву і ціну
# купівлі токеном бота й запускає цей workflow; research/sell.py рахує ціну й пороги Preisvorschlag, пише назву й опис
# німецькою і шле картку в бот. Репозиторій публічний — тому blob зашифрований, а в лог не пишемо ні ціну, ні прибуток.
# 09.10: той самий workflow підключає eBay («ebay вхід» → код → ключ шифровано назад в Apps Script) і виставляє
# оголошення кнопкою «🚀» (research/ebay_list.py, Trading API). Ключ eBay живе лише в Script Properties.

on:
  workflow_dispatch:
    inputs:
      blob:
        description: "Зашифровані дані (з Apps Script)"
        required: false
        default: ""
      mac:
        description: "Підпис"
        required: false
        default: ""
      nonce:
        description: "Nonce"
        required: false
        default: ""
      test_title:
        description: "Перевірка без Apps Script: назва товару (без ціни купівлі, лише в лог)"
        required: false
        default: ""

concurrency:
  group: sell
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sell:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 17.10: Poof.bg — 4 фото на хвилину
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 17.10: маски Poof.bg (лише силует товару, без даних) — прев'ю й публікація того самого фото = один запит з 100 на місяць
      - uses: actions/cache@v5   # 18.10: v4 — Node 20 (застаріло), v5 — Node 24
        with:
          path: photo_cache
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      - run: mkdir -p photo_cache && find photo_cache -type f -mtime +30 -delete

      - name: Self-check (unit tests)
        run: python -m unittest test_sell test_ebay_list test_ebay_actions test_parcels test_listings test_photo_studio test_onhand test_audit test_finances test_ebay_messages test_ebay_sign

      - name: Prepare listing
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          POOF_KEY: ${{ secrets.POOF_KEY }}   # 17.10: Poof.bg — вирізання фону (100 фото на місяць безкоштовно)
          PHOTO_CACHE: photo_cache
          TRACK17_KEY: ${{ secrets.TRACK17_KEY }}   # 13.10: 17TRACK — DHL, Hermes, DPD (ключ DHL видано лише на робочу пошту — без нього)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 26.10: перевірка оголошень — номер і обсяг з фото (research/audit.py)
          PYTHONIOENCODING: utf-8
        # параметри (зашифрований blob) читаємо з файлу події, а не з env — env видно в журналі кроку
        run: python research/sell.py --from-event
