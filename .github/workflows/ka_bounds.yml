name: ka-bounds

# 10.10: межі ціни («Preis bis») підписок Kleinanzeigen. Тижневий звіт показує межі, що відстали від ринку більш ніж на 5%;
# користувач міняє їх у KA і тисне «✅ Межі в KA оновив» → Apps Script (ledger.gs, boundsCommand_) запускає цей workflow →
# research/ka_bounds.py --accept записує рекомендовані межі як поточні в research/ka_bounds.json.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "accept — записати рекомендовані межі як поточні; show — показати всі в боті"
        required: false
        default: "accept"

concurrency:
  group: ka-bounds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-check (unit tests)
        run: python -m unittest test_weekly_report

      - name: Accept bounds
        if: inputs.mode == 'accept'
        env:
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python research/ka_bounds.py --accept

      - name: Show bounds
        if: inputs.mode == 'show'
        env:
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python research/ka_bounds.py --show

      - name: Commit if changed
        run: |
          git config user.name "ebay-bot"
          git config user.email "bot@local"
          git add research/ka_bounds.json
          if git diff --cached --quiet; then
            echo "без змін"
          else
            git commit -m "ka-bounds: KA subscription price limits accepted $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi
