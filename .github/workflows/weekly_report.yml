name: weekly-report

# Тижневий звіт у бот «Облік і продаж» (01.10). Запускає Apps Script (tools/ledger.gs): щопонеділка з 9:00 за Берліном
# або командою «звіт». Рядки обліку приходять зашифрованими (ключ — токен бота); лічильники пошуку — з кешів станів
# ботів (лише читаємо). Репозиторій публічний: у лог — тільки «надіслано», жодних сум.

on:
  workflow_dispatch:
    inputs:
      blob:
        description: "Зашифровані рядки обліку (з Apps Script)"
        required: true
      mac:
        description: "Підпис"
        required: true
      nonce:
        description: "Nonce"
        required: true

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-check (unit tests)
        run: python -m unittest test_weekly_report test_sell

      - name: Restore eBay watcher state (read-only)
        uses: actions/cache/restore@v4
        with:
          path: ebay_watch_state.json
          key: ebaywatch-weekly-${{ github.run_id }}
          restore-keys: ebaywatch-

      - name: Restore KA mail state (read-only)
        uses: actions/cache/restore@v4
        with:
          path: ram_mail_state.json
          key: rammailstate-weekly-${{ github.run_id }}
          restore-keys: rammailstate-

      - name: Send report
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          OFFICE_BOT_TOKEN: ${{ secrets.OFFICE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB: ${{ inputs.blob }}
          MAC: ${{ inputs.mac }}
          NONCE: ${{ inputs.nonce }}
          PYTHONIOENCODING: utf-8
        run: python research/weekly_report.py --blob "$BLOB" --mac "$MAC" --nonce "$NONCE" --ebay ebay_watch_state.json --ka ram_mail_state.json
